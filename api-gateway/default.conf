upstream auth {
    server auth-service:3001;
}

upstream students {
    server student-service:3002;
}

upstream courses {
    server course-service:3003;
}

upstream attendance {
    server attendance-service:3004;
}

upstream grades {
    server grades-service:3005;
}

upstream events {
    server events-service:3006;
}

upstream cafeteria {
    server cafeteria-service:3007;
}

upstream library {
    server library-service:3008;
}

upstream notification {
    server notification-service:3009;
}

upstream payment {
    server payment-service:3010;
}

upstream analytics {
    server analytics-service:3013;
}

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/auth/ {
        proxy_pass http://auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/students/ {
        proxy_pass http://students/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/courses/ {
        proxy_pass http://courses/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/attendance/ {
        proxy_pass http://attendance/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/grades/ {
        proxy_pass http://grades/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/events/ {
        proxy_pass http://events/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/cafeteria/ {
        proxy_pass http://cafeteria/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/library/ {
        proxy_pass http://library/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/notifications/ {
        proxy_pass http://notification/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/payments/ {
        proxy_pass http://payment/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/analytics/ {
        proxy_pass http://analytics/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        access_log off;
        return 200 "API Gateway is healthy\n";
        add_header Content-Type text/plain;
    }
}